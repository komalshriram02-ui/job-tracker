<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            max-width: 760px;
            margin: 40px auto;
            padding: 0 12px;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 1px 4px #0003;
            margin-bottom: 16px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            font-size: 15px;
            box-sizing: border-box;
        }

        button {
            background: #2f6fed;
            color: #fff;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        #msg {
            min-height: 20px;
            color: #c00;
        }

        #authBox {
            max-width: 420px;
            margin: 20px auto;
        }

        #dashboard {
            display: none;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top button {
            width: auto;
            padding: 8px 16px;
            background: #e5484d;
        }

        .stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stat {
            flex: 1;
            min-width: 90px;
            text-align: center;
            background: #eef2ff;
            padding: 12px;
            border-radius: 8px;
        }

        .stat b {
            display: block;
            font-size: 24px;
        }

        .row {
            border-top: 1px solid #eee;
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .row small {
            color: #666;
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .actions select {
            width: auto;
            margin: 0;
            padding: 8px;
        }

        .delbtn {
            width: auto;
            margin: 0;
            padding: 8px 12px;
            background: #e5484d;
        }
    </style>
</head>

<body>
    <div id="authBox" class="card">
        <h2>Job Application Tracker</h2>
        <input id="username" placeholder="Username">
        <input id="password" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <button onclick="register()">Register</button>
        <div id="msg"></div>
    </div>

    <div id="dashboard">
        <div class="card top">
            <h2 style="margin:0">My Applications</h2>
            <button onclick="logout()">Logout</button>
        </div>

        <div class="card">
            <div class="stats" id="stats"></div>
        </div>

        <div class="card">
            <h3 style="margin-top:0">Add Application</h3>
            <input id="company" placeholder="Company">
            <input id="role" placeholder="Role">
            <select id="status">
                <option>Applied</option>
                <option>Interview</option>
                <option>Offer</option>
                <option>Rejected</option>
            </select>
            <input id="notes" placeholder="Notes (optional)">
            <button onclick="addApplication()">Add</button>
            <div id="addMsg" style="color:#c00"></div>
        </div>

        <div class="card">
            <input id="search" placeholder="Search company or role" oninput="loadDashboard()">
            <select id="filter" onchange="loadDashboard()">
                <option value="">All statuses</option>
                <option>Applied</option>
                <option>Interview</option>
                <option>Offer</option>
                <option>Rejected</option>
            </select>
            <div id="list"></div>
        </div>
    </div>

    <script>
        const msg = document.getElementById("msg");
        const STATUSES = ["Applied", "Interview", "Offer", "Rejected"];

        function showError(data) {
            msg.style.color = "#c00";
            if (Array.isArray(data.detail)) {
                msg.textContent = data.detail[0].msg.replace("Value error, ", "");
            } else {
                msg.textContent = data.detail;
            }
        }

        function makeEl(tag, text, cls) {
            const el = document.createElement(tag);
            if (text !== undefined) el.textContent = text;
            if (cls) el.className = cls;
            return el;
        }

        function authHeaders() {
            return {
                "Content-Type": "application/json",
                Authorization: "Bearer " + localStorage.getItem("token"),
            };
        }

        async function register() {
            const res = await fetch("/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value,
                }),
            });
            const data = await res.json();
            if (!res.ok) return showError(data);
            msg.style.color = "green";
            msg.textContent = "Registered! Now login.";
        }

        async function login() {
            const res = await fetch("/auth/login", {
                method: "POST",
                body: new URLSearchParams({
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value,
                }),
            });
            const data = await res.json();
            if (!res.ok) return showError(data);
            localStorage.setItem("token", data.access_token);
            document.getElementById("password").value = "";
            msg.textContent = "";
            loadDashboard();
        }

        function logout() {
            localStorage.removeItem("token");
            document.getElementById("dashboard").style.display = "none";
            document.getElementById("authBox").style.display = "block";
        }

        async function api(path) {
            const res = await fetch(path, { headers: authHeaders() });
            if (res.status === 401) {
                logout();
                throw new Error("Not logged in");
            }
            return res.json();
        }

        async function addApplication() {
            const addMsg = document.getElementById("addMsg");
            const company = document.getElementById("company").value.trim();
            const role = document.getElementById("role").value.trim();
            if (!company || !role) {
                addMsg.textContent = "Company and role are required";
                return;
            }

            const res = await fetch("/applications", {
                method: "POST",
                headers: authHeaders(),
                body: JSON.stringify({
                    company,
                    role,
                    status: document.getElementById("status").value,
                    notes: document.getElementById("notes").value,
                }),
            });
            if (!res.ok) {
                addMsg.textContent = "Could not add application";
                return;
            }

            ["company", "role", "notes"].forEach((id) => (document.getElementById(id).value = ""));
            addMsg.textContent = "";
            loadDashboard();
        }

        async function updateStatus(id, status) {
            await fetch("/applications/" + id, {
                method: "PUT",
                headers: authHeaders(),
                body: JSON.stringify({ status }),
            });
            loadDashboard();
        }

        async function deleteApplication(id) {
            if (!confirm("Delete this application?")) return;
            await fetch("/applications/" + id, {
                method: "DELETE",
                headers: authHeaders(),
            });
            loadDashboard();
        }

        async function loadDashboard() {
            const stats = await api("/stats");
            const params = new URLSearchParams({
                q: document.getElementById("search").value.trim(),
                status: document.getElementById("filter").value,
            });
            const apps = await api("/applications?" + params);
            document.getElementById("authBox").style.display = "none";
            document.getElementById("dashboard").style.display = "block";

            const statsBox = document.getElementById("stats");
            statsBox.replaceChildren();
            const total = makeEl("div", undefined, "stat");
            total.append(makeEl("b", stats.total), "Total");
            statsBox.append(total);
            STATUSES.forEach((s) => {
                const box = makeEl("div", undefined, "stat");
                box.append(makeEl("b", stats.by_status[s] || 0), s);
                statsBox.append(box);
            });

            const list = document.getElementById("list");
            list.replaceChildren();
            if (apps.length === 0) {
                list.append(makeEl("p", "No applications yet."));
            }
            apps.forEach((a) => {
                const row = makeEl("div", undefined, "row");

                const left = makeEl("div");
                left.append(makeEl("b", a.company), " - " + a.role, document.createElement("br"));
                left.append(makeEl("small", a.applied_date + (a.notes ? "  |  " + a.notes : "")));

                const right = makeEl("div", undefined, "actions");
                const sel = document.createElement("select");
                STATUSES.forEach((s) => {
                    const opt = makeEl("option", s);
                    opt.selected = s === a.status;
                    sel.append(opt);
                });
                sel.onchange = () => updateStatus(a.id, sel.value);

                const del = makeEl("button", "Delete", "delbtn");
                del.onclick = () => deleteApplication(a.id);

                right.append(sel, del);
                row.append(left, right);
                list.append(row);
            });
        }

        if (localStorage.getItem("token")) {
            loadDashboard().catch(() => { });
        }
    </script>
</body>

</html>
